<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login Page</title>
</head>
<body>
    <h1 class="heading">Login Page</h1>

    <form action="style.css" method="post" class="login">
        <label for="User Name">User Name</label><br>
        <input type="text" placeholder="Enter Your User Name:" class="fields"><br><br>
        <label for="password">Enter Password</label><br>
        <input type="password" placeholder="Enter Your Password" class="fields"><br><br>

        <button class="register-btn">Login</button>
    </form>
</body>
</html>
