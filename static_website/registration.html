<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>    
    <link rel="stylesheet" href="style.css">
    <title>Registration Form</title>
</head>
<body>
    <!-- Navbar Loads Here -->
    <div id="navbar"></div>

    <h1 class="heading">
        Registration Form
    </h1>
    <form action="registration.html" method="post" class="register">
        <label for="Name">Full Name :</label><br>
    <input type="text" placeholder="Enter Your Name" name="name" class="fields"><br><br>
    <label for="Email">Email :</label><br>
    <input type="email" placeholder="Enter Your Email" name="email" class="fields"><br><br>
    <label for="password">Password</label><br>
    <input type="password" placeholder="Enter Your Password" name="password" class="fields"><br><br>
    <label for="Birthdate">Enter Your Birthdate</label><br>
    <input type="date" class="fields">
    <div class="gender">
    <label for="Gender">Gender</label><br>
    <label for="male">Male</label>
    <input type="radio" name="Gender" class="r-gender">
    <label for="Female">Female</label>
    <input type="radio" name="Gender" class="r-gender"><br><br>
    </div>

    <label for="Hobbies">Hobbies :</label><br>
    <div class="hobbies">
    <input type="checkbox"> Music <br>
    <input type="checkbox"> photography <br>
    <input type="checkbox"> cooking <br>
    <input type="checkbox"> Writing <br>
    <input type="checkbox">  Drawing <br>
    </div>

    <div class="state">
        <label for="State">State</label>
    <select name="" id="">
        <option value="">Select State</option>
        <option value="">Gujarat</option>
        <option value="">Maharastra</option>
        <option value="">chennai</option>
    </select><br><br>
    </div>
    <label for="Address">Address</label>
    <textarea name="address" class="fields"></textarea><br><br>

    <button class="register-btn">Register</button>
    <p style="text-align: center;">Already have account ? <a href="login.html">Login</a></p>
    </form>

    
    <script src="script.js"></script>
    
</body>
</html>
